name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write
  id-token: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04 # x86_64, older glibc for wider AppImage compat
          - os: ubuntu-22.04-arm # aarch64 (free arm runner for public repos)
          - os: windows-latest # x86_64 MSVC
          - os: macos-latest # aarch64 (Apple Silicon; x86_64 Intel builds via
            # `cargo build --target x86_64-apple-darwin` from source — the
            # free macos-13 runner pool is retired and queued jobs forever)
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux deps (Tauri v2 + serialport)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev build-essential curl wget file \
            libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev \
            libudev-dev pkg-config

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.os }}

      - name: Build and upload release assets
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: apps/mbscada
          tagName: v__VERSION__
          releaseName: 'mbSCADA v__VERSION__'
          releaseBody: 'Installers and portable binaries for all supported platforms. See the assets below.'
          releaseDraft: false
          prerelease: false

      # Portable (standalone) archives: run without installing anything.
      #   Windows: zip with the exe (WebView2 ships with Win10/11)
      #   macOS:   zip with the .app bundle (drag-and-drop, no dmg)
      #   Linux:   AppImage from tauri-action is already no-install
      - name: Package portable (no-install) archives
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          VER="${TAG#v}"
          case "${{ runner.os }}-${{ runner.arch }}" in
            Windows-X64)
              EXE=$(ls target/release/mbSCADA.exe target/release/mbscada.exe 2>/dev/null | head -1)
              if [ -n "$EXE" ]; then
                cp "$EXE" mbSCADA_x64_portable.exe
                7z a -tzip "mbSCADA_${VER}_x64_portable.zip" mbSCADA_x64_portable.exe >/dev/null
                rm mbSCADA_x64_portable.exe
                gh release upload "$TAG" "mbSCADA_${VER}_x64_portable.zip" --clobber --repo "$GITHUB_REPOSITORY"
              else
                echo "no exe found in target/release" && ls target/release | head -20 && exit 1
              fi
              ;;
            macOS-ARM64)
              APP=$(ls -d target/release/bundle/macos/*.app 2>/dev/null | head -1)
              if [ -n "$APP" ]; then
                (cd "$(dirname "$APP")" && zip -qry "/tmp/mbSCADA_${VER}_macos-arm64_portable.zip" "$(basename "$APP")")
                gh release upload "$TAG" "/tmp/mbSCADA_${VER}_macos-arm64_portable.zip" --clobber --repo "$GITHUB_REPOSITORY"
              else
                echo "no .app bundle found" && ls target/release/bundle 2>/dev/null || true
              fi
              ;;
          esac

      # The OPC UA bridge is a plain cargo binary — built natively on every
      # release runner and attached to the same release (the tauri-action
      # step above has created it by now).
      - name: Upload mb-opc bridge binary
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cargo build --release -p mb-opc
          TAG="${GITHUB_REF#refs/tags/}"
          case "${{ runner.os }}-${{ runner.arch }}" in
            Linux-X64)   NAME=mb-opc-linux-x64 ;;
            Linux-ARM64) NAME=mb-opc-linux-arm64 ;;
            macOS-ARM64) NAME=mb-opc-macos-arm64 ;;
            Windows-X64) NAME=mb-opc-windows-x64.exe ;;
            *)           NAME=mb-opc-unknown ;;
          esac
          cp "target/release/mb-opc${{ runner.os == 'Windows' && '.exe' || '' }}" "$NAME"
          gh release upload "$TAG" "$NAME" --clobber --repo "$GITHUB_REPOSITORY"

  # Signed release: one SHA256SUMS for every artifact, cosign keyless signature
  # (sigstore transparency log, no long-lived keys) + optional GPG signature.
  sign:
    name: Sign release assets
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - name: Publish SHA256SUMS and its signatures
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          TAG="${GITHUB_REF#refs/tags/}"
          mkdir -p assets && cd assets
          gh release download "$TAG" --dir . --clobber --repo "$GITHUB_REPOSITORY" || true
          rm -f SHA256SUMS*
          sha256sum * > ../SHA256SUMS.txt
          cd ..
          cat SHA256SUMS.txt
          gh release upload "$TAG" SHA256SUMS.txt --clobber --repo "$GITHUB_REPOSITORY"

          curl -sSfL -o cosign https://github.com/sigstore/cosign/releases/latest/download/cosign-linux-amd64
          chmod +x cosign
          ./cosign sign-blob --yes \
            --output-signature SHA256SUMS.txt.sig \
            --output-certificate SHA256SUMS.txt.pem \
            SHA256SUMS.txt
          gh release upload "$TAG" SHA256SUMS.txt.sig SHA256SUMS.txt.pem --clobber \
            --repo "$GITHUB_REPOSITORY"

      - name: GPG signature over the checksums (optional, secret-gated)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
        run: |
          set -e
          TAG="${GITHUB_REF#refs/tags/}"
          if [ -z "$GPG_PRIVATE_KEY" ]; then
            echo "No GPG_PRIVATE_KEY secret - skipping the GPG signature."
            exit 0
          fi
          echo "$GPG_PRIVATE_KEY" | gpg --batch --import
          gpg --batch --yes --pinentry-mode loopback ${GPG_PASSPHRASE:+--passphrase "$GPG_PASSPHRASE"} \
            --armor --detach-sign --output SHA256SUMS.txt.asc SHA256SUMS.txt
          gpg --verify SHA256SUMS.txt.asc SHA256SUMS.txt
          gh release upload "$TAG" SHA256SUMS.txt.asc --clobber --repo "$GITHUB_REPOSITORY"
