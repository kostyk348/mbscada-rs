name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    # A hanging integration test must fail fast: the OPC UA bridge e2e waits
    # on a live session, and a deadlock there would otherwise burn the
    # default six-hour job limit.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: install udev + ssl (serialport and opcua dependencies)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libudev-dev pkg-config libssl-dev
      - name: cargo test
        run: cargo test
        env:
          RUST_LOG: debug
