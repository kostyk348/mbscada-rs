name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    # A hanging integration test must fail fast: the OPC UA bridge e2e waits
    # on a live session, and a deadlock there would otherwise burn the
    # default six-hour job limit.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: install udev + ssl (serialport and opcua dependencies)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libudev-dev pkg-config libssl-dev
      - name: cargo test
        run: cargo test
        env:
          RUST_LOG: debug

  ui:
    # Pure-JS UI helpers (apps/mbscada/ui/bits.js) — node:test, no build step.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: node --test (bits.js)
        run: node --test apps/mbscada/ui/bits.test.cjs
      - name: main.js parses
        run: node --check apps/mbscada/ui/main.js && node --check apps/mbscada/ui/bits.js
