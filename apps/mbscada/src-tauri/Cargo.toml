[package]
name = "mbscada"
description = "mbSCADA — Modbus Poll replacement + SCADA desktop app (Tauri)"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
name = "mbscada_lib"
crate-type = ["rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
mb-format = { path = "../../../crates/mb-format" }
mb-proto = { path = "../../../crates/mb-proto" }
mb-sim = { path = "../../../crates/mb-sim" }
mb-engine = { path = "../../../crates/mb-engine" }
serialport = "4"
tauri-plugin-dialog = "2"
